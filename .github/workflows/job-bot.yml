name: Job Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install discord.py

      - name: Run Job Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FRIEND_ID: ${{ secrets.FRIEND_ID }}
        run: python bot.py

      - name: Save Job Bot state
        run: |
          if git diff --quiet -- jobbot_state.txt; then
            echo "No state change."
            exit 0
          fi

          git config user.name "Job Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobbot_state.txt
          git commit -m "Update Job Bot state"
          git push
